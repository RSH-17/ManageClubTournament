<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d18" />
    <title>게임 유형 선택 | LCK UI</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
        background: #090d18;
        color: #f4f7ff;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: #f4f7ff;
        background:
          radial-gradient(circle at 12% 10%, rgba(58, 88, 174, .22), transparent 29rem),
          radial-gradient(circle at 92% 85%, rgba(130, 74, 178, .14), transparent 31rem),
          #090d18;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .24;
        background-image: linear-gradient(#a7baff0d 1px, transparent 1px), linear-gradient(90deg, #a7baff0d 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
      }

      .shell { width: min(1120px, calc(100% - 48px)); margin: 0 auto; position: relative; }

      header {
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #ffffff17;
      }

      .brand { display: flex; align-items: center; gap: 13px; font-weight: 800; letter-spacing: -.04em; font-size: 19px; }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 1px solid #8daaff99;
        border-radius: 11px;
        color: #c4d2ff;
        background: linear-gradient(145deg, #243970, #111a37);
        box-shadow: 0 0 24px #4160c735;
        font-size: 17px;
      }
      .header-note { color: #8893ae; font-size: 13px; letter-spacing: .08em; }

      main { padding: 94px 0 100px; }
      .eyebrow { color: #8ba7ff; font-size: 12px; font-weight: 800; letter-spacing: .19em; }
      h1 { margin: 16px 0 15px; color: #f4f7ff; font-size: clamp(36px, 5vw, 58px); line-height: 1.18; letter-spacing: -.065em; }
      .intro { margin: 0; color: #a1abc2; font-size: 17px; line-height: 1.7; }

      .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 53px; }
      .choice {
        position: relative;
        min-height: 355px;
        padding: 31px;
        border: 1px solid #35415b;
        border-radius: 20px;
        background: linear-gradient(145deg, #171e31 0%, #111827 72%);
        color: #f4f7ff;
        text-align: left;
        cursor: pointer;
        overflow: hidden;
        transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
      }
      .choice:hover { transform: translateY(-4px); border-color: #7895e3; box-shadow: 0 18px 55px #0005; }
      .choice:focus-visible { outline: 3px solid #a6bcff; outline-offset: 4px; }
      .choice[aria-pressed="true"] { border-color: #91aaff; background: linear-gradient(145deg, #1d2c51, #111b30 72%); box-shadow: inset 0 0 0 1px #91aaff50, 0 16px 50px #3f61bd28; }
      .choice::after { content: ""; position: absolute; width: 260px; height: 260px; right: -92px; bottom: -140px; border: 1px solid #9fb6ff30; border-radius: 50%; box-shadow: 0 0 0 42px #9fb6ff09, 0 0 0 84px #9fb6ff07; }
      .choice.tournament::after { border-color: #d5a7ff38; box-shadow: 0 0 0 42px #d5a7ff0a, 0 0 0 84px #d5a7ff07; }
      .card-top { display: flex; justify-content: space-between; align-items: start; }
      .icon { display: grid; place-items: center; width: 57px; height: 57px; border-radius: 15px; background: #314672; color: #c6d5ff; }
      .tournament .icon { background: #4b3464; color: #e7caff; }
      .icon svg { width: 29px; height: 29px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .check { display: grid; place-items: center; width: 25px; height: 25px; border: 1px solid #56627c; border-radius: 50%; color: transparent; font-size: 16px; font-weight: bold; }
      .choice[aria-pressed="true"] .check { background: #9db4ff; border-color: #9db4ff; color: #112041; }
      .tag { display: inline-block; margin-top: 45px; color: #9fb8ff; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
      .tournament .tag { color: #d7b5f5; }
      .title { display: block; margin-top: 10px; color: #f4f7ff; font-size: 31px; font-weight: 800; letter-spacing: -.05em; }
      .description { display: block; max-width: 340px; margin-top: 14px; color: #a8b2c9; font-size: 15px; line-height: 1.7; }
      .select-label { position: absolute; left: 31px; bottom: 30px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: #e7ecff; }
      .select-label span { font-size: 19px; line-height: 1; }

      .footer-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 27px; }
      .selected-text { margin: 0; color: #8995b1; font-size: 14px; }
      .selected-text strong { color: #d7e1ff; }
      .continue { min-width: 174px; padding: 14px 21px; border: 1px solid #7d99ee; border-radius: 10px; background: #8da8fa; color: #111a31; font: inherit; font-weight: 800; cursor: pointer; transition: background .2s ease, transform .2s ease; }
      .continue:hover:not(:disabled) { background: #adbeff; transform: translateY(-2px); }
      .continue:disabled { border-color: #4d608d; background: #263756; color: #c7d5f7; cursor: not-allowed; }
      .continue:focus-visible { outline: 3px solid #d3ddff; outline-offset: 3px; }
      .footnote { margin-top: 78px; padding-top: 25px; border-top: 1px solid #ffffff14; color: #66728d; font-size: 12px; letter-spacing: .04em; }

      @media (max-width: 700px) {
        .shell { width: min(100% - 32px, 510px); }
        header { height: 76px; }
        .header-note { display: none; }
        main { padding: 64px 0 50px; }
        .intro { font-size: 15px; }
        .choices { grid-template-columns: 1fr; gap: 14px; margin-top: 36px; }
        .choice { min-height: 280px; padding: 24px; }
        .tag { margin-top: 26px; }
        .title { font-size: 27px; }
        .select-label { left: 24px; bottom: 23px; }
        .footer-row { align-items: stretch; flex-direction: column; }
        .continue { width: 100%; }
        .footnote { margin-top: 55px; }
      }
      @media (prefers-reduced-motion: reduce) { .choice, .continue { transition: none; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand"><span class="brand-mark" aria-hidden="true">◆</span><span>LCK UI</span></div>
        <div class="header-note">GAME SETUP / 01</div>
      </header>

      <main>
        <div class="eyebrow">SELECT GAME TYPE</div>
        <h1>어떤 게임에 참여하시나요?</h1>
        <p class="intro">진행하려는 게임의 유형을 선택해 주세요.</p>

        <div class="choices" role="group" aria-label="게임 유형 선택">
          <button class="choice" type="button" data-type="내전용" aria-pressed="false">
            <span class="card-top">
              <span class="icon" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="11" cy="11" r="4"/><circle cx="23" cy="12" r="3"/><path d="M3.5 26c.4-5.3 3-8 7.5-8s7.1 2.7 7.5 8H3.5ZM19 20c4.7-.9 8.7 1.3 9.5 6H22"/></svg></span>
              <span class="check" aria-hidden="true">✓</span>
            </span>
            <span class="tag">CUSTOM MATCH</span>
            <span class="title">내전용</span>
            <span class="description">친구, 팀원과 함께하는 내전을 위한 화면을 선택합니다.</span>
            <span class="select-label">내전용 선택 <span aria-hidden="true">↗</span></span>
          </button>

          <button class="choice tournament" type="button" data-type="대회용" aria-pressed="false">
            <span class="card-top">
              <span class="icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 5h14v9a7 7 0 0 1-14 0V5ZM9 8H4v4a5 5 0 0 0 5 5m14-9h5v4a5 5 0 0 1-5 5M16 21v5m-6 2h12"/></svg></span>
              <span class="check" aria-hidden="true">✓</span>
            </span>
            <span class="tag">TOURNAMENT</span>
            <span class="title">대회용</span>
            <span class="description">공식 경기와 토너먼트 진행을 위한 화면을 선택합니다.</span>
            <span class="select-label">대회용 선택 <span aria-hidden="true">↗</span></span>
          </button>
        </div>

        <div class="footer-row">
          <p class="selected-text" id="selection-status" aria-live="polite">게임 유형을 선택해 주세요.</p>
          <button class="continue" type="button" id="continue-button" disabled>계속하기 &nbsp;→</button>
        </div>
        <div class="footnote">LCK UI · GAME TYPE SELECTION</div>
      </main>
    </div>

    <script>
      const choices = document.querySelectorAll('.choice');
      const status = document.getElementById('selection-status');
      const continueButton = document.getElementById('continue-button');

      choices.forEach((choice) => {
        choice.addEventListener('click', () => {
          choices.forEach((item) => item.setAttribute('aria-pressed', String(item === choice)));
          status.innerHTML = `선택한 유형: <strong>${choice.dataset.type}</strong>`;
          continueButton.disabled = false;
        });
      });
    </script>
  </body>
</html>
